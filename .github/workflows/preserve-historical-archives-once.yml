name: Preserve exact historical graph archive bytes once
on:
  push:
    branches: [Veraphify]
    paths: [".github/workflows/preserve-historical-archives-once.yml"]
permissions:
  contents: read
jobs:
  preserve:
    if: github.repository_id == '1472890396' && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/Veraphify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Preserve only two known public graph artifact ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/Veraphify | cut -f1)" = "$GITHUB_SHA"
          mkdir -p archive/bytes
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15101520309/zip" > "$RUNNER_TEMP/15101520309.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15102763847/zip" > "$RUNNER_TEMP/15102763847.zip"
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path("archive/bytes")
          entries=[
            (15101520309,"v0.0.0.1","e0f9e7acab71efa71fd4898625360966a5fa08a3","9ee12f2bb81d49cd9be6aa270ccf213ccdc91bc88a9901dd7991d5533624eed6"),
            (15102763847,"v0.0.0.2","ab6235f64c45c3739bcd2b138da0824e5082e8ef","3025b47191803cd2ca8e49c305b07f07376b6b949b95f12805ec7773940e976f"),
          ]
          def digest(data): return hashlib.sha256(data).hexdigest()
          for ident,version,source,want in entries:
              source_path=pathlib.Path(os.environ["RUNNER_TEMP"])/f"{ident}.zip"
              data=source_path.read_bytes()
              if digest(data)!=want: raise ValueError("unexpected artifact digest")
              with zipfile.ZipFile(source_path) as z:
                  if z.testzip() is not None: raise ValueError("invalid archive")
                  pins=json.loads(z.read("pins.json"))
                  if pins["project"]!="vixttha/schedule-HQ" or pins["version"]!=version or pins["source"]!=source: raise ValueError("wrong provenance")
                  for name,key in [("graph/graph.json","graph_sha256"),("graph/receipt.json","receipt_sha256")]:
                      if digest(z.read(name))!=pins[key]: raise ValueError("internal digest mismatch")
                  archived=[n for n in z.namelist() if n.startswith("archive/") and n.endswith(".json")]
                  if len(archived)!=1 or digest(z.read(archived[0]))!=pins["archive_sha256"]: raise ValueError("archive digest mismatch")
              target=root/f"{version}-{source[:7]}.zip"
              if target.exists() and target.read_bytes()!=data: raise ValueError("immutable archive conflict")
              if not target.exists(): target.write_bytes(data)
              print(f"PASS: immutable archive {version} {source} {want}")
          PY
          git add -- archive/bytes/v0.0.0.1-e0f9e7a.zip archive/bytes/v0.0.0.2-ab6235f.zip
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve exact public historical graph ZIPs'
          test "$(git ls-remote origin refs/heads/Veraphify | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/Veraphify
