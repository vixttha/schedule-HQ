name: Verify VIB installation
on:
  push:
    branches: [Version-Issues-Hub]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python tools/checkpoint.py check
      - name: Verify installed package bytes and historical assignments
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path('vib-install.json').read_text())
          for path,digest in m['package_files_sha256'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          assert m['target_repository'].lower()=='vixttha/schedule-hq'
          assert m['enforcement']=='disabled'
          l=json.loads(Path('ledger/issue-versions.json').read_text())
          assert {1:'v0.0.0.1',2:'v0.0.0.2'}.items() <= {r['issue']:r['version'] for r in l['issues']}.items()
          h=json.loads(Path('ledger/handoff.json').read_text())
          assert h['active'] is None
          print('PASS: all pinned package hashes, preserved historical assignments, no active lease')
          PY
