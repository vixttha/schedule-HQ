name: Verify frozen baseline and proposed layout
on:
  push:
    branches: ['plan/checkpoint-v*', main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  plan:
    if: github.event.repository.visibility == 'public' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python tools/verify_layout_plan.py
      - run: python tools/check.py
      - run: python tools/generate_views.py --check
      - run: python tools/render_history.py --check
      - run: python tools/qualify_workload.py --output workload-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workload-receipt-${{ matrix.os }}
          path: workload-receipt.json
          if-no-files-found: error
      - run: python -m unittest discover -s tests -v
      - name: Qualify local adoption against an isolated checkout of this public repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fixture="$RUNNER_TEMP/shq-adoption"
          git clone --no-local --no-hardlinks "$GITHUB_WORKSPACE" "$fixture"
          git -C "$fixture" checkout --detach "$GITHUB_SHA"
          git -C "$fixture" checkout -b schedule-hq
          git -C "$fixture" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          python -B tools/adopt.py install --checkout "$fixture" --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID"
          python -B tools/adopt.py verify --checkout "$fixture" --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID"
          python -B tools/adopt.py uninstall --checkout "$fixture" --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID"
          test -d "$fixture/.schedule-hq"
          python -B tools/adopt.py uninstall --apply --checkout "$fixture" --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID"
          test ! -e "$fixture/.schedule-hq"
          test -f "$fixture/.schedule-hq-removed/manifest.json"
          test "$(git -C "$fixture" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$fixture" diff --exit-code HEAD
          echo "PASS: isolated exact-source repository adoption, dry run, retirement and tracked files unchanged; no remote push"
      - name: Verify rollback in a separate checkout
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/schedule-rollback" 1fe825f284aa36e30b31f8f7a927b3942d58b9c5
          (cd "$RUNNER_TEMP/schedule-rollback" && python -B tools/check.py && python -B -m unittest discover -s tests -v && python -B tools/verify_publication.py)
          test -z "$(git -C "$RUNNER_TEMP/schedule-rollback" status --porcelain)"
          git worktree remove "$RUNNER_TEMP/schedule-rollback"
          git worktree add --detach "$RUNNER_TEMP/schedule-rollback2" 1d2028fed6ed731432fd6d8670ddb9f3e4e5a5c8
          (cd "$RUNNER_TEMP/schedule-rollback2" && python -B tools/check.py && python -B -m unittest discover -s tests -v && python -B tools/generate_views.py --check)
          test -z "$(git -C "$RUNNER_TEMP/schedule-rollback2" status --porcelain)"
          git worktree remove "$RUNNER_TEMP/schedule-rollback2"
          git worktree add --detach "$RUNNER_TEMP/schedule-rollback3" 7b4575b42008f71c4c3a014bc6f23c0f1f89793d
          (cd "$RUNNER_TEMP/schedule-rollback3" && python -B tools/check.py && python -B -m unittest discover -s tests -v && python -B tools/generate_views.py --check)
          test -z "$(git -C "$RUNNER_TEMP/schedule-rollback3" status --porcelain)"
          git worktree remove "$RUNNER_TEMP/schedule-rollback3"
  reader:
    if: github.event.repository.visibility == 'public' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: product
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: vixttha/README-HQ
          ref: 43e29074099742a2c73741176286a44ccdf861a1
          path: reader
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r reader/tools/requirements.txt
      - name: Verify current homepage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C reader rev-parse HEAD)" = '43e29074099742a2c73741176286a44ccdf861a1'
          test "$(git -C product rev-parse HEAD)" = "$GITHUB_SHA"
          python -c 'import json,os,pathlib; p=pathlib.Path("product/docs/architecture/readme-smoke.json"); d=json.loads(p.read_text()); d["commit"]=os.environ["GITHUB_SHA"]; pathlib.Path(os.environ["RUNNER_TEMP"],"readme-smoke.json").write_text(json.dumps(d))'
          python reader/tools/check_readme_hq.py --repo product --ref "$GITHUB_SHA" --smoke "$RUNNER_TEMP/readme-smoke.json" --require-smoke --receipt "$RUNNER_TEMP/readme-audit.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: readme-hq-audit
          path: ${{ runner.temp }}/readme-audit.json
          if-no-files-found: error

  schema:
    if: github.event.repository.visibility == 'public' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r tests/requirements-schema-linux.txt
      - run: python -m pip check
      - run: python tools/qualify_schema.py
