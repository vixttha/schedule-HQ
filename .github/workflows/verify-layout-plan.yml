name: Verify frozen baseline and proposed layout
on:
  push:
    branches: [plan/checkpoint-v0.0.0.2, main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  plan:
    if: github.event.repository.visibility == 'public' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python tools/verify_layout_plan.py
      - run: python tools/check.py
      - run: python tools/generate_views.py --check
      - run: python -m unittest discover -s tests -v
      - name: Verify rollback in a separate checkout
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/schedule-rollback" 1fe825f284aa36e30b31f8f7a927b3942d58b9c5
          (cd "$RUNNER_TEMP/schedule-rollback" && python tools/check.py && python -m unittest discover -s tests -v && python tools/verify_publication.py)
          git worktree remove "$RUNNER_TEMP/schedule-rollback"
  reader:
    if: github.event.repository.visibility == 'public' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: product
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: vixttha/README-HQ
          ref: 43e29074099742a2c73741176286a44ccdf861a1
          path: reader
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r reader/tools/requirements.txt
      - name: Verify current homepage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C reader rev-parse HEAD)" = '43e29074099742a2c73741176286a44ccdf861a1'
          test "$(git -C product rev-parse HEAD)" = "$GITHUB_SHA"
          python reader/tools/check_readme_hq.py --repo product --ref "$GITHUB_SHA" --receipt "$RUNNER_TEMP/readme-audit.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: readme-hq-audit
          path: ${{ runner.temp }}/readme-audit.json
          if-no-files-found: error
