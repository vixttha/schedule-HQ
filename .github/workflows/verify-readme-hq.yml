name: Qualify pinned README HQ adoption
on:
  push:
    branches: [readme-hq]
permissions:
  contents: read
jobs:
  reader:
    if: github.event.repository.visibility == 'public' && github.event.repository.private == false
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: vixttha/README-HQ
          ref: 43e29074099742a2c73741176286a44ccdf861a1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r tools/requirements.txt
      - name: Verify source and run reader
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '43e29074099742a2c73741176286a44ccdf861a1'
          python tools/check_readme_hq.py
